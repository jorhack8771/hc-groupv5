  <style>
    :root {
      --hc-blue: #0E70B6;
      --hc-blue-deep: #0C558A;
      --hc-green: #94C11E;
      --ink: #16222B;
      --gray: #56616B;
      --paper: #FFFFFF;
      --display: "Poppins", system-ui, sans-serif;
      --body: "Source Sans 3", system-ui, sans-serif;
    }
    body {
      font-family: var(--body);
      color: var(--ink);
      background: var(--paper);
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }
    .logo {
      margin-bottom: 40px;
      height: 150px;
      max-width: 90vw;
    }
    h1 {
      font-family: var(--display);
      font-size: 2.5rem;
      color: var(--hc-blue-deep);
      margin-bottom: 15px;
      font-weight: 800;
    }
    p {
      font-size: 1.1rem;
      color: var(--gray);
      max-width: 600px;
      line-height: 1.6;
      margin-bottom: 30px;
    }
    .btn {
      display: inline-block;
      background: linear-gradient(135deg, var(--hc-blue), var(--hc-blue-deep));
      color: white;
      padding: 12px 28px;
      border-radius: 999px;
      text-decoration: none;
      font-family: var(--display);
      font-weight: 600;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(14, 112, 182, 0.2);
    }
    /* BuilderBot responsive widget */
    [data-builderbot-chat], [data-builderbot-container], [data-builderbot-root], [id*="builderbot" i], [class*="builderbot" i], iframe[src*="builderbot" i] {
      box-sizing: border-box !important;
    }
    #builderbot-widget-root, .builderbot-widget-root, [data-builderbot-root], [data-builderbot-container], div:has(> iframe[src*="builderbot" i]) {
      z-index: 9999 !important;
      isolation: isolate !important;
    }
    @media (min-width: 641px) {
      div[id*="builderbot" i][style*="fixed"]:not([id*="launcher" i]):not([id*="button" i]):not([id*="bubble" i]):not([id*="toggle" i]),
      div[class*="builderbot" i][style*="fixed"]:not([class*="launcher" i]):not([class*="button" i]):not([class*="bubble" i]):not([class*="toggle" i]),
      div[id*="builderbot-window" i], div[class*="builderbot-window" i], div[id*="builderbot-chat" i], div[class*="builderbot-chat" i] {
        position: fixed !important;
        bottom: 20px !important;
        right: 20px !important;
        left: auto !important;
        top: auto !important;
        width: 380px !important;
        max-width: calc(100vw - 40px) !important;
        height: 600px !important;
        max-height: calc(100vh - 40px) !important;
        border-radius: 16px !important;
        z-index: 9999 !important;
        box-sizing: border-box !important;
      }
    }
    @media (max-width: 640px) {
      [id*="builderbot" i]:not([id*="button" i]):not([id*="launcher" i]):not([id*="toggle" i]):not([id*="icon" i]):not([id*="bubble" i]),
      [class*="builderbot" i]:not([class*="button" i]):not([class*="launcher" i]):not([class*="toggle" i]):not([class*="icon" i]):not([class*="bubble" i]),
      div[id*="builderbot" i][style*="fixed"], div[class*="builderbot" i][style*="fixed"],
      iframe[src*="builderbot" i] {
        position: fixed !important;
        width: 100% !important;
        max-width: 100vw !important;
        height: 100% !important;
        max-height: 100dvh !important;
        left: 0 !important;
        right: 0 !important;
        top: 0 !important;
        bottom: 0 !important;
        min-width: 0 !important;
        min-height: 0 !important;
        z-index: 9999 !important;
        box-sizing: border-box !important;
      }
    }
    /* Header Corporativo Verde HC Group Latam */
    .chat-header,
    [class*="chat-header" i],
    chat-header {
      background: #567116 !important;
      background: linear-gradient(135deg, #567116 0%, #445911 100%) !important;
      color: #ffffff !important;
      border-bottom: none !important;
      border-top-left-radius: 16px !important;
      border-top-right-radius: 16px !important;
      padding: 12px 14px !important;
    }
    .header-title {
      display: flex !important;
      align-items: center !important;
      gap: 12px !important;
      flex: 1 !important;
      min-width: 0 !important;
    }
    chat-avatar,
    [class*="chat-avatar" i] {
      display: inline-flex !important;
      width: 38px !important;
      height: 38px !important;
      min-width: 38px !important;
      min-height: 38px !important;
      flex-shrink: 0 !important;
      margin-right: 6px !important;
      align-items: center !important;
      justify-content: center !important;
    }
    .avatar-container,
    .participant-avatar,
    [class*="avatar-container" i] {
      width: 38px !important;
      height: 38px !important;
      min-width: 38px !important;
      min-height: 38px !important;
      border-radius: 50% !important;
      background-color: #ffffff !important;
      border: 2px solid rgba(255, 255, 255, 0.95) !important;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2) !important;
      position: relative !important;
      overflow: hidden !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      padding: 2px !important;
      box-sizing: border-box !important;
    }
    .meeting-info {
      display: flex !important;
      flex-direction: column !important;
      justify-content: center !important;
      min-width: 0 !important;
      flex: 1 !important;
      gap: 2px !important;
    }
    .meeting-name,
    .truncate-title,
    [class*="meeting-name" i] {
      color: #ffffff !important;
      font-weight: 700 !important;
      font-size: 15px !important;
      line-height: 1.2 !important;
      margin: 0 !important;
    }
    .meeting-subtitle,
    .truncate-subtitle,
    [class*="meeting-subtitle" i] {
      color: rgba(255, 255, 255, 0.9) !important;
    }
    .connection-status, [class*="connection-status" i] {
      display: inline-flex !important;
      align-items: center !important;
      gap: 6px !important;
      margin-top: 3px !important;
    }
    .builderbot-status-text {
      font-size: 12px !important;
      font-weight: 500 !important;
      line-height: 1 !important;
      letter-spacing: 0.01em !important;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
      user-select: none !important;
      transition: color 0.3s ease !important;
    }
    .builderbot-status-text.connected {
      color: rgba(255, 255, 255, 0.95) !important;
    }
    .builderbot-status-text.disconnected {
      color: rgba(254, 202, 202, 0.9) !important;
    }
    .status-indicator {
      width: 8px !important;
      height: 8px !important;
      border-radius: 50% !important;
    }
    .status-indicator.connected {
      background-color: #22c55e !important;
      box-shadow: 0 0 0 2px rgba(86, 113, 22, 0.9), 0 0 6px #22c55e !important;
    }
    .status-indicator.disconnected {
      background-color: #f87171 !important;
      box-shadow: 0 0 0 2px rgba(86, 113, 22, 0.9), 0 0 6px #ef4444 !important;
    }
    .chat-header button, chat-header button, .back-button, .clear-button, .resize-button, .close-button {
      color: #ffffff !important;
    }
    .chat-header button svg, chat-header button svg, .back-button svg, .clear-button svg, .resize-button svg, .close-button svg {
      stroke: #ffffff !important;
      color: #ffffff !important;
    }
    chat-widget-container,
    .chat-widget-container,
    .chat-widget-container *,
    .chat-window,
    .chat-messages,
    .messages-container,
    .chat-body,
    .chat-content,
    [class*="messages-container" i],
    [class*="chat-messages" i] {
      overscroll-behavior: contain !important;
      -webkit-overflow-scrolling: touch !important;
    }
    /* Botón flotante del chat - Hover con el azul del logo HC Group (#0E70B6) */
    .chat-button,
    .chat-widget-button,
    chat-widget-button,
    [class*="chat-widget-button" i],
    [class*="chat-button" i] {
      transition: all 0.25s ease !important;
    }
    .chat-button:hover,
    .chat-widget-button:hover,
    chat-widget-button:hover,
    [class*="chat-widget-button" i]:hover,
    [class*="chat-button" i]:hover,
    button[class*="chat-button"]:hover,
    button[class*="chat-widget-button"]:hover {
      background-color: #0E70B6 !important;
      background: linear-gradient(135deg, #0E70B6 0%, #0C558A 100%) !important;
      color: #ffffff !important;
      border-color: #0C558A !important;
      box-shadow: 0 6px 22px rgba(14, 112, 182, 0.45) !important;
      transform: scale(1.06) !important;
    }
    .chat-button:hover svg,
    .chat-widget-button:hover svg,
    chat-widget-button:hover svg,
    [class*="chat-widget-button" i]:hover svg,
    [class*="chat-button" i]:hover svg {
      stroke: #ffffff !important;
      color: #ffffff !important;
    }
